[project]
name = "commercial-ml"
version = "0.1.0"
description = "Commercial analytics ML: HCP segmentation, Rx forecasting, engagement targeting, campaign effectiveness (DiD/IPW) and uplift-based next best action, validated against planted ground truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "duckdb>=1.1",
    "matplotlib>=3.9",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
